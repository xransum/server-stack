# Docker Compose — media-vm stack
#
# Target: media-vm on Proxmox compute server (Ubuntu 24.04 + Docker).
# Status: ACTIVE — deployed on media-vm (192.168.1.169).
#
# Usage:
#   docker compose --profile media up -d
#   docker compose --profile media --profile indexers --profile cloudflare-bypass up -d
#   docker compose --profile proxy up -d
#
# Profiles:
#   media              Plex, Tautulli, Overseerr, Calibre-Web
#   indexers           Sonarr, Radarr, Prowlarr, rdt-client, queue-cleaner, rdt-blocklist
#   cloudflare-bypass  Byparr, byparr-unwrap, byparr-proxy instances
#   proxy              Nginx Proxy Manager (reverse proxy + SSL) + Cloudflare Tunnel
#   s3                 Reserved profile (MinIO runs natively on TrueNAS)
#   infra              dns-updater (deprecated — CF Tunnel replaces this)
#
# NFS mounts (add to /etc/fstab on media-vm before starting):
#   192.168.1.164:/mnt/media/movies      /mnt/media/movies      nfs  rw,hard,intr,_netdev,noatime  0  0
#   192.168.1.164:/mnt/media/tv          /mnt/media/tv          nfs  rw,hard,intr,_netdev,noatime  0  0
#   192.168.1.164:/mnt/media/music       /mnt/media/music       nfs  rw,hard,intr,_netdev,noatime  0  0
#   192.168.1.164:/mnt/media/audiobooks  /mnt/media/audiobooks  nfs  rw,hard,intr,_netdev,noatime  0  0
#   192.168.1.164:/mnt/media/books       /mnt/media/books       nfs  rw,hard,intr,_netdev,noatime  0  0
#   192.168.1.164:/mnt/media/downloads   /mnt/media/downloads   nfs  rw,hard,intr,_netdev,noatime  0  0
#
# CRITICAL: downloads and media must be on the same NFS server so Sonarr/Radarr
#           can hardlink on import instead of copy. All mounts are from 192.168.1.164.
#
# See docs/storage.md, docs/proxmox-compute.md, docs/migration.md.

name: server-stack

x-restart: &restart-policy
  restart: unless-stopped

x-media-env: &puid-pgid
  PUID: "1000"
  PGID: "1000"
  TZ: America/New_York

services:

  # ---------------------------------------------------------------------------
  # MEDIA profile
  # ---------------------------------------------------------------------------

  plex:
    <<: *restart-policy
    image: lscr.io/linuxserver/plex:latest
    profiles: [media]
    container_name: plex
    network_mode: host   # Plex requires host networking for local device discovery
    environment:
      <<: *puid-pgid
      VERSION: docker
      PLEX_CLAIM: ${PLEX_CLAIM:-}   # https://www.plex.tv/claim — optional, only needed first run
    volumes:
      - plex-config:/config
      - /mnt/media/movies:/mnt/media/movies:ro
      - /mnt/media/tv:/mnt/media/tv:ro
      - /mnt/media/music:/mnt/media/music:ro
      - /mnt/media/audiobooks:/mnt/media/audiobooks:ro
    # NVIDIA GPU passthrough for NVENC hardware transcoding (Plex Pass required)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  tautulli:
    <<: *restart-policy
    image: lscr.io/linuxserver/tautulli:latest
    profiles: [media]
    container_name: tautulli
    environment:
      <<: *puid-pgid
    volumes:
      - tautulli-config:/config
    ports:
      - "8181:8181"

  overseerr:
    <<: *restart-policy
    image: lscr.io/linuxserver/overseerr:latest
    profiles: [media]
    container_name: overseerr
    environment:
      <<: *puid-pgid
    volumes:
      - overseerr-config:/config
    ports:
      - "5055:5055"

  calibre-web:
    <<: *restart-policy
    image: lscr.io/linuxserver/calibre-web:latest
    profiles: [media]
    container_name: calibre-web
    environment:
      <<: *puid-pgid
      DOCKER_MODS: linuxserver/mods:universal-calibre
    volumes:
      - calibre-web-config:/config
      - /mnt/media/books:/books
      # Auto-import watcher — runs inotifywait inside the container on /books
      - ./calibre-watch-init.sh:/custom-cont-init.d/99-calibre-watch:ro
    ports:
      - "8083:8083"

  # ---------------------------------------------------------------------------
  # INDEXERS profile
  # ---------------------------------------------------------------------------

  sonarr:
    <<: *restart-policy
    image: lscr.io/linuxserver/sonarr:latest
    profiles: [indexers]
    container_name: sonarr
    environment:
      <<: *puid-pgid
    volumes:
      - sonarr-config:/config
      # IMPORTANT: tv and downloads must be on the same NFS server for hardlinks.
      - /mnt/media/tv:/mnt/media/tv
      - /mnt/media/downloads:/mnt/media/downloads
    ports:
      - "8989:8989"

  radarr:
    <<: *restart-policy
    image: lscr.io/linuxserver/radarr:latest
    profiles: [indexers]
    container_name: radarr
    environment:
      <<: *puid-pgid
    volumes:
      - radarr-config:/config
      # IMPORTANT: movies and downloads must be on the same NFS server for hardlinks.
      - /mnt/media/movies:/mnt/media/movies
      - /mnt/media/downloads:/mnt/media/downloads
    ports:
      - "7878:7878"

  prowlarr:
    <<: *restart-policy
    image: lscr.io/linuxserver/prowlarr:latest
    profiles: [indexers]
    container_name: prowlarr
    environment:
      <<: *puid-pgid
    volumes:
      - prowlarr-config:/config
      # Custom Cardigann definitions (byparr-proxy indexers)
      - ./custom-definitions:/config/Definitions/Custom:ro
    ports:
      - "9696:9696"

  rdt-client:
    <<: *restart-policy
    image: rogerfar/rdtclient:latest
    profiles: [indexers]
    container_name: rdt-client
    environment:
      <<: *puid-pgid
    volumes:
      - rdt-client-config:/data/db
      - /mnt/media/downloads:/mnt/media/downloads
    ports:
      - "6500:6500"

  queue-cleaner:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/queue-cleaner/Dockerfile
    image: server-stack/queue-cleaner:local
    profiles: [indexers]
    container_name: queue-cleaner
    env_file:
      - ${QUEUE_CLEANER_ENV:-./queue-cleaner.env}
    # queue-cleaner is timer-driven; run it every 5 minutes via restart + sleep
    # Alternative: replace with a proper cron container or systemd timer on host
    entrypoint: ["sh", "-c", "while true; do python -u /app/queue-cleaner.py; sleep 300; done"]
    depends_on:
      - sonarr
      - radarr

  rdt-blocklist:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/rdt-blocklist/Dockerfile
    image: server-stack/rdt-blocklist:local
    profiles: [indexers]
    container_name: rdt-blocklist
    env_file:
      - ${RDT_BLOCKLIST_ENV:-./rdt-blocklist.env}
    volumes:
      # Mount downloads read-only — only needs access to rdtclient.db.
      - /mnt/media/downloads:/mnt/media/downloads:ro
    depends_on:
      - rdt-client
      - sonarr
      - radarr

  # ---------------------------------------------------------------------------
  # CLOUDFLARE-BYPASS profile
  # ---------------------------------------------------------------------------

  byparr:
    <<: *restart-policy
    image: ghcr.io/thephaseless/byparr:latest
    profiles: [cloudflare-bypass]
    container_name: byparr
    environment:
      TZ: America/New_York
    ports:
      - "8192:8191"   # byparr listens on 8191 internally; expose as 8192 to match native install

  byparr-unwrap:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/byparr-unwrap/Dockerfile
    image: server-stack/byparr-unwrap:local
    profiles: [cloudflare-bypass]
    container_name: byparr-unwrap
    environment:
      PORT: "8193"
      LOG_LEVEL: INFO
      UNWRAP_UPSTREAM_URL: http://byparr:8191   # script appends self.path (/v1), so no trailing /v1 here
    ports:
      - "8193:8193"
    depends_on:
      - byparr

  byparr-proxy-1337x:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/byparr-proxy/Dockerfile
    image: server-stack/byparr-proxy:local
    profiles: [cloudflare-bypass]
    container_name: byparr-proxy-1337x
    environment:
      UPSTREAM: https://1337x.to
      BYPARR: http://byparr:8191/v1   # HTML — no unwrap sidecar needed
      PORT: "8881"
      TIMEOUT_MS: "120000"
      LOG_LEVEL: INFO
      CACHE_TTL_S: "3600"
      STUB_CAT_PATHS: "true"
    ports:
      - "8881:8881"
    depends_on:
      - byparr

  byparr-proxy-apibay:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/byparr-proxy/Dockerfile
    image: server-stack/byparr-proxy:local
    profiles: [cloudflare-bypass]
    container_name: byparr-proxy-apibay
    environment:
      UPSTREAM: https://apibay.org
      BYPARR: http://byparr-unwrap:8193/v1   # JSON — route via unwrap sidecar
      PORT: "8882"
      TIMEOUT_MS: "120000"
      LOG_LEVEL: INFO
      CACHE_TTL_S: "300"
      STUB_CAT_PATHS: "true"
    ports:
      - "8882:8882"
    depends_on:
      - byparr-unwrap

  # ---------------------------------------------------------------------------
  # PROXY profile
  # ---------------------------------------------------------------------------

  nginx-proxy-manager:
    <<: *restart-policy
    image: jc21/nginx-proxy-manager:latest
    profiles: [proxy]
    container_name: nginx-proxy-manager
    ports:
      - "80:80"
      - "443:443"
      - "81:81"   # Nginx PM admin UI - restrict to Tailscale access only
    volumes:
      - nginx-pm-data:/data
      - nginx-pm-letsencrypt:/etc/letsencrypt

  cloudflared:
    <<: *restart-policy
    image: cloudflare/cloudflared:latest
    profiles: [proxy]
    container_name: cloudflared
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}

  cloudflare-ddns:
    <<: *restart-policy
    image: favonia/cloudflare-ddns:latest
    profiles: [proxy]
    container_name: cloudflare-ddns
    # Keeps grey-cloud DNS records updated when home IP changes.
    # Add new game server subdomains to DOMAINS as they are created.
    environment:
      CLOUDFLARE_API_TOKEN: ${CF_DDNS_TOKEN}
      DOMAINS: "plex.xransum.com,mc1.xransum.com,mc2.xransum.com,valheim.xransum.com,satisfactory.xransum.com,factorio.xransum.com"
      PROXIED: "false"
      UPDATE_CRON: "@every 5m"
      IP6_PROVIDER: "none"

  # ---------------------------------------------------------------------------
  # S3 profile
  # ---------------------------------------------------------------------------
  # RESOLVED: MinIO runs as a native TrueNAS Scale app, not on media-vm.
  #
  # MinIO is deployed on the NAS via TrueNAS Apps, backed by `/mnt/s3/store`.
  # It is not deployed as a Docker container in this compose stack.
  #
  # Usage (from any machine):
  #   aws configure set aws_access_key_id <key>
  #   aws configure set aws_secret_access_key <secret>
  #   aws s3 ls s3://mybucket --endpoint-url http://nas-ip:9000
  #
  # Keep the `s3` profile name reserved for potential future use (for example,
  # Garage as a media-vm sidecar), but there are no active services today.

  # ---------------------------------------------------------------------------
  # INFRA profile (deprecated)
  # ---------------------------------------------------------------------------

  dns-updater:
    <<: *restart-policy
    build:
      context: ..
      dockerfile: docker/dns-updater/Dockerfile
    image: server-stack/dns-updater:local
    profiles: [infra]
    container_name: dns-updater
    # DEPRECATED: Cloudflare Tunnel (cloudflared, proxy profile) replaces this
    # service entirely. dns-updater kept here for reference and fallback only.
    # If CF Tunnel is running, do not start this profile.
    env_file:
      - ${DNS_UPDATER_ENV:-./dns-updater.env}

# ---------------------------------------------------------------------------
# Named volumes (app config + databases — local to media-vm, NOT on NFS)
# SQLite over NFS has locking issues. Keep config/DB on local VM disk.
# ---------------------------------------------------------------------------
volumes:
  plex-config:
  tautulli-config:
  overseerr-config:
  calibre-web-config:
  sonarr-config:
  radarr-config:
  prowlarr-config:
  rdt-client-config:
  nginx-pm-data:
  nginx-pm-letsencrypt:
