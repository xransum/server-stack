# Docker Compose -- gameservers-vm stack (Pelican)
#
# Target: gameservers-vm on Proxmox compute server (separate VM from media-vm).
# Status: UNTESTED -- awaiting lab hardware.
#
# This stack runs independently of docker-compose.yml (different VM).
#
# Game servers are managed by Pelican (the actively maintained Beta successor
# to Pterodactyl), not by per-game compose services. Pelican has two parts:
#
#   - Panel: the web UI + API (this compose stack).
#   - Wings: the node daemon that runs each game server in its own Docker
#     container from a Pelican "egg". Wings needs the host Docker socket and a
#     full kernel, which is why gameservers-vm is a KVM VM, not an LXC.
#
# You do NOT define one compose service per game here. Each game is created in
# the Panel UI from an egg, and Wings spins up its container on demand. See
# docs/proxmox-compute.md "Game server workflow" and docs/migration.md Phase
# 5.5 for the migration/import flow.
#
# Storage model:
#   - Live worlds run on the gameservers-vm LOCAL disk (Wings data dir below).
#     Running live game state over NFS risks SQLite/world-file corruption and
#     latency, so it stays local.
#   - Durability comes from Pelican scheduled backups pushed to the NAS
#     dev/gameservers dataset, mounted as a BACKUP TARGET (not a live mount):
#       nas-ip:/mnt/dev/gameservers  /mnt/gameservers  nfs  rw,sync,hard,intr  0 0
#     The NAS also keeps ZFS snapshots of that dataset (7d / 4w) as a second
#     independent restore path.
#
# Per-game resource limits are set on each Pelican server when it is created.
# Starting estimates (fill in per modpack when standing up each game):
#   Minecraft Java (PaperMC)  cpus 4   mem 8-12G   port 25565/tcp
#   Minecraft Bedrock         cpus 2   mem 4G      port 19132/udp
#   Valheim                   cpus 4   mem 4-8G    ports 2456-2457/udp
#   Palworld                  cpus 8   mem 8-16G   ports 8211,27015/udp
#   Counter-Strike 2          cpus 4   mem 2-6G    port 27015/tcp+udp
#   (plus any existing serverhub engine: Rust, Satisfactory, Factorio, 7DtD)

name: gameservers

x-restart: &restart-policy
  restart: unless-stopped

services:

  # Pelican Panel -- web UI + API. Always-on, reverse-proxied via Nginx PM
  # (pelican.xransum.com through Cloudflare Tunnel; see docs/proxmox-compute.md).
  panel:
    <<: *restart-policy
    image: ghcr.io/pelican-dev/panel:latest
    container_name: pelican-panel
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_URL: ${PELICAN_APP_URL:-http://localhost}
      APP_TIMEZONE: America/New_York
      # Panel DB/cache point at the sibling services below.
      DB_CONNECTION: mariadb
      DB_HOST: panel-db
      DB_PORT: "3306"
      DB_DATABASE: panel
      DB_USERNAME: pelican
      DB_PASSWORD: ${PELICAN_DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: panel-cache
    volumes:
      - pelican-panel-data:/pelican-data
      - pelican-panel-logs:/var/www/html/storage/logs
    depends_on:
      - panel-db
      - panel-cache

  panel-db:
    <<: *restart-policy
    image: mariadb:11
    container_name: pelican-panel-db
    environment:
      MARIADB_DATABASE: panel
      MARIADB_USER: pelican
      MARIADB_PASSWORD: ${PELICAN_DB_PASSWORD}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - pelican-panel-db:/var/lib/mysql

  panel-cache:
    <<: *restart-policy
    image: redis:7-alpine
    container_name: pelican-panel-cache
    volumes:
      - pelican-panel-cache:/data

  # Pelican Wings -- node daemon. Runs each game server as its own container.
  # Requires the host Docker socket and host networking. Register this node in
  # the Panel after first start (Panel -> Nodes -> create, then drop the
  # generated config into /etc/pelican/config.yml).
  wings:
    <<: *restart-policy
    image: ghcr.io/pelican-dev/wings:latest
    container_name: pelican-wings
    network_mode: host
    tty: true
    environment:
      TZ: America/New_York
      WINGS_UID: "988"
      WINGS_GID: "988"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/pelican:/etc/pelican
      - /var/lib/pelican:/var/lib/pelican        # live game server data (LOCAL disk)
      - /var/log/pelican:/var/log/pelican
      - /tmp/pelican:/tmp/pelican
      - /mnt/gameservers:/mnt/gameservers         # NAS backup target (Pelican backups)

# Named volumes hold Panel config/DB/cache only. Live game-server data lives on
# the local disk via Wings' /var/lib/pelican bind mount above; backups go to the
# NAS via /mnt/gameservers.
volumes:
  pelican-panel-data:
  pelican-panel-logs:
  pelican-panel-db:
  pelican-panel-cache:
