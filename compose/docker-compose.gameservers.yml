# Docker Compose -- gameservers-vm stack (Pelican Panel only)
#
# Target: gameservers-vm on Proxmox compute server (separate VM from media-vm).
# Deployed and operational as of 2026-10-19.
#
# This stack runs independently of docker-compose.yml (different VM).
# Deploy: ssh gameservers-vm, cd /opt/gameservers/server-stack/compose
#         docker compose -f docker-compose.gameservers.yml up -d
#
# Pelican has two parts:
#   - Panel: the web UI + API -- runs here in Docker (image: ghcr.io/pelican/panel)
#   - Wings: the node daemon that runs each game server -- installed as a native
#     systemd binary (see docs/proxmox-compute.md). Wings is NOT in this compose
#     file because it needs the host Docker socket and host networking; the
#     official install method is a binary + systemd unit, not a container.
#
# Panel uses SQLite by default (no MariaDB/Redis needed). The panel is served
# behind Nginx Proxy Manager on media-vm which terminates TLS, so BEHIND_PROXY
# is set to true and TRUSTED_PROXIES is set to the NPM host IP.
#
# Storage model:
#   - Live worlds run on the gameservers-vm LOCAL disk (Wings data dir).
#     Running live game state over NFS risks SQLite/world-file corruption and
#     latency, so it stays local.
#   - Durability comes from Pelican scheduled backups pushed to the NAS
#     dev/gameservers dataset, mounted as a BACKUP TARGET (not a live mount):
#       nas-ip:/mnt/dev/gameservers  /mnt/gameservers  nfs  rw,sync,hard,intr  0 0
#     The NAS also keeps ZFS snapshots of that dataset (7d / 4w) as a second
#     independent restore path.
#
# Per-game resource limits are set on each Pelican server when it is created.
# Starting estimates (fill in per modpack when standing up each game):
#   Minecraft Java (NeoForge/Forge)   cpus 8-12  mem 12-16G  port 25565/tcp
#   Valheim                           cpus 4     mem 4-8G    ports 2456-2457/udp
#   Palworld                          cpus 8     mem 8-16G   ports 8211,27015/udp
#   Counter-Strike 2                  cpus 4     mem 2-6G    port 27015/tcp+udp
#   Satisfactory                      cpus 4     mem 8G      port 7777/udp
#   Factorio                          cpus 2     mem 4G      port 34197/udp

name: gameservers

services:

  # Pelican Panel -- web UI + API. Always-on, reverse-proxied via Nginx PM
  # (pelican.xransum.com through Cloudflare Tunnel; see docs/proxmox-compute.md).
  # BEHIND_PROXY=true tells the panel not to obtain its own TLS cert since NPM
  # handles SSL termination. Map host port 80 to container port 80.
  panel:
    image: ghcr.io/pelican/panel:latest
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - pelican-panel-data:/pelican-data
      - pelican-panel-logs:/var/www/html/storage/logs
    environment:
      APP_URL: ${PELICAN_APP_URL:-https://pelican.xransum.com}
      APP_TIMEZONE: America/New_York
      BEHIND_PROXY: "true"
      # media-vm (NPM host) LAN IP -- update if NPM moves
      TRUSTED_PROXIES: "192.168.1.169,172.17.0.1,172.20.0.1"

# Named volumes hold Panel config/data only.
# Live game-server data lives on the local disk managed by the Wings binary
# at /var/lib/pelican; backups go to the NAS via /mnt/gameservers NFS mount.
volumes:
  pelican-panel-data:
  pelican-panel-logs:
